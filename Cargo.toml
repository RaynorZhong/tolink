[package]
name = "tolink"
version = "0.2.1"
edition = "2024"
publish = false
description = "A small Rust participant client for a Tolight chat room"
repository = "https://github.com/RaynorZhong/tolink"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
serde_json = "=1.0.149"
sha2 = "=0.10.9"
libc = "=0.2.191"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
