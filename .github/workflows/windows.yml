name: Native Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
      TMPDIR: ${{ runner.temp }}\tolink-scratch
      TMP: ${{ runner.temp }}\tolink-scratch
      TEMP: ${{ runner.temp }}\tolink-scratch
      TOLINK_BUILD_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare scratch and native MSVC toolchain
        run: |
          New-Item -ItemType Directory -Force -Path $env:TMPDIR | Out-Null
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          cargo --version

      - name: Native regression tests (no identity or provider credentials)
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile standalone synthetic native TLS/model peer
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = @(Get-ChildItem -LiteralPath $metadata.target_directory -Filter '*.rlib' -Recurse)
          $rustcArgs = @('--edition=2024', 'tests/support/native_peer.rs', '-o', (Join-Path $env:TMPDIR 'native-peer.exe'))
          foreach ($crate in @('serde_json', 'windows_sys')) {
            $artifact = $artifacts | Where-Object { $_.Name -like "lib$crate-*.rlib" } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if (-not $artifact) { throw "Missing compiled dependency: $crate" }
            $rustcArgs += @('--extern', "$crate=$($artifact.FullName)")
          }
          foreach ($directory in ($artifacts.DirectoryName | Sort-Object -Unique)) {
            $rustcArgs += @('-L', "dependency=$directory")
          }
          rustc @rustcArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locked release build and offline example validation
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\tolink.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\tolink.exe validate examples/config.windows.example.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
